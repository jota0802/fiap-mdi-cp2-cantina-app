name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - name: Run tests
        env:
          JWT_SECRET: 'ci-secret-min-32-chars-please-rotate'
          USE_PGLITE: 'true'
        run: pnpm -r test
      - run: pnpm -r lint || true   # lint is best-effort; some workspaces may not have it
